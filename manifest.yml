modules:
  macro:
    - key: latex-block
      resource: main
      title: LaTeX formula
      description: Typeset a LaTeX formula (display mode) with KaTeX, rendered in the
        page. No data leaves Atlassian.
      category: text-formatting
      layout: block
      emitsReadyEvent: true
      config:
        resource: config
        title: LaTeX formula
        viewportSize: large
        openOnInsert: true
      adfExport:
        function: export
    - key: latex-inline
      resource: main
      title: LaTeX inline
      description: Typeset a short LaTeX expression inline with the surrounding text.
      category: text-formatting
      layout: inline
      emitsReadyEvent: true
      config:
        resource: config
        title: LaTeX inline
        viewportSize: medium
        openOnInsert: true
      adfExport:
        function: export
  jira:issueContext:
    - key: latex-issue-context
      resource: jira-panel
      resolver:
        function: resolver
      title: LaTeX
      label: Formulas in this issue
      icon: resource:jira-panel;icon.svg
  function:
    - key: export
      handler: export.handler
    - key: resolver
      handler: resolver.handler
resources:
  - key: main
    path: static/main
  - key: config
    path: static/config
  - key: jira-panel
    path: static/jira-panel
permissions:
  scopes:
    - read:jira-work
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/0702c860-239c-4a35-bd49-c6d7fe556b99
