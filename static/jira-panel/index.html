<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX</title>
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; color: inherit; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 4px 0 8px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  #status { color: #626f86; font-size: 12px; }
  button { padding: 4px 10px; border-radius: 3px; border: 0; background: #f1f2f4; color: #172b4d; font-weight: 600; cursor: pointer; }
  h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #626f86; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #f1f2f4; }
  .row code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8590a2; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .katex-host.display { overflow-x: auto; overflow-y: hidden; }
  .katex-host.size-normal .katex { font-size: 1.15em; }
  .hint { color: #626f86; font-style: italic; }
  .error { color: #ae2e24; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bar"><span id="status"></span><button id="refresh" type="button" title="Re-read the issue">Refresh</button></div>
<div id="root"></div>
<script src="./bundle.js"></script>
</body>
</html>
