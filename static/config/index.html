<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX formula settings</title>
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; color: inherit; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 8px 4px; }
  label { display: block; font-weight: 600; font-size: 12px; color: #626f86; margin: 8px 0 4px; }
  textarea { width: 100%; min-height: 110px; box-sizing: border-box; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
             border: 2px solid #dfe1e6; border-radius: 3px; padding: 6px 8px; resize: vertical; }
  textarea:focus { outline: none; border-color: #388bff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  select { width: 100%; padding: 6px; border: 2px solid #dfe1e6; border-radius: 3px; background: white; }
  #preview { min-height: 48px; padding: 10px 12px; border: 1px dashed #dfe1e6; border-radius: 3px; overflow-x: auto; }
  .katex-host.size-small .katex { font-size: 1em; }
  .katex-host.size-normal .katex { font-size: 1.21em; }
  .katex-host.size-large .katex { font-size: 1.5em; }
  .hint { color: #626f86; font-style: italic; }
  .error { color: #ae2e24; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  button { padding: 6px 12px; border-radius: 3px; border: 0; font-weight: 600; cursor: pointer; }
  #save { background: #0c66e4; color: white; }
  #save:disabled { background: #dfe1e6; color: #8590a2; cursor: default; }
  #cancel { background: #f1f2f4; color: #172b4d; }
  #status { color: #626f86; font-size: 12px; }
  .help { color: #626f86; font-size: 12px; margin-top: 8px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<label for="tex">LaTeX source</label>
<textarea id="tex" spellcheck="false" placeholder="E(\mathbf x) = \sum_i Q_{ii} x_i + \sum_{i&lt;j} Q_{ij} x_i x_j"></textarea>
<div class="row">
  <div>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="auto">Auto (block macro → display, inline macro → inline)</option>
      <option value="display">Display</option>
      <option value="inline">Inline</option>
    </select>
  </div>
  <div>
    <label for="size">Size</label>
    <select id="size">
      <option value="small">Small</option>
      <option value="normal">Normal</option>
      <option value="large">Large</option>
    </select>
  </div>
</div>
<label>Preview</label>
<div id="preview" class="hint"></div>
<div class="actions">
  <button id="save" type="button">Save</button>
  <button id="cancel" type="button">Cancel</button>
  <span id="status"></span>
</div>
<p class="help">KaTeX syntax. Shortcuts: <code>\dB</code>, <code>\dBm</code>, <code>\argmax</code>. Ctrl/⌘+Enter saves. PDF and Word exports show the source in a code block.</p>
<script src="./bundle.js"></script>
</body>
</html>
