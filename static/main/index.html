<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX formula</title>
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; color: inherit; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body.inline { width: fit-content; }                 /* lets an inline macro shrink below the 300px default */
  .katex-host.display { padding: 4px 0; overflow-x: auto; overflow-y: hidden; }
  .katex-host.inline { display: inline-block; white-space: nowrap; }
  .katex-host.size-small .katex { font-size: 1em; }
  .katex-host.size-normal .katex { font-size: 1.21em; }
  .katex-host.size-large .katex { font-size: 1.5em; }
  .katex-display { margin: 0.2em 0; }
  .hint { color: #626f86; font-style: italic; }
  .error { color: #ae2e24; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out" class="hint">Loading…</div>
<script src="./bundle.js"></script>
</body>
</html>
